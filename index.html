<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu dia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --text: #1f2328; --muted: #6b7078; --faint: #a3a6ab;
    --line: #e2e0da; --hover: #f1efe9; --accent: #2f6f5e; --accent-soft: #e3efe9;
    --alta: #c2412d; --media: #c98a12; --baixa: #3f7fbf; --fire: #d9622b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151617; --card: #1f2123; --text: #e8e6e1; --muted: #9a9ea5; --faint: #63676d;
      --line: #313437; --hover: #2a2c2f; --accent: #6bbfa4; --accent-soft: #23332d;
      --alta: #ef7a63; --media: #e7b54a; --baixa: #79aee6; --fire: #f08a55;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  header { margin-bottom: 20px; }
  .date-line { color: var(--muted); font-size: 0.9rem; }
  h1 { margin: 2px 0 12px; font-size: 1.9rem; letter-spacing: -0.02em; }
  .progress { display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; max-width: 420px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .progress-text { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 18px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 10px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .sub { color: var(--muted); font-size: 0.82rem; }
  .head-actions { display: flex; gap: 4px; }

  button { font: inherit; color: var(--text); cursor: pointer; }
  .link-btn { border: none; background: none; color: var(--muted); font-size: 0.82rem; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
  .link-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn { border: none; background: none; color: var(--muted); padding: 4px 7px; border-radius: 6px; font-size: 0.95rem; line-height: 1; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; font-size: 0.9rem; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #10201b; } }
  .btn.danger { color: var(--alta); }

  .add-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; margin: 2px 0 4px; }
  .add-row:focus-within { background: var(--hover); }
  .add-row .plus { color: var(--accent); font-size: 1.2rem; line-height: 1; }
  .add-row input { flex: 1; border: none; background: none; font: inherit; color: var(--text); outline: none; padding: 4px 0; }
  .add-row input::placeholder { color: var(--accent); }

  ul.items { list-style: none; margin: 0; padding: 0; min-height: 6px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px;
    border-left: 3px solid transparent;
  }
  .item:hover { background: var(--hover); }
  .item.p-alta { border-left-color: var(--alta); }
  .item.p-media { border-left-color: var(--media); }
  .item.p-baixa { border-left-color: var(--baixa); }
  .item input[type=checkbox], .habit input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; margin: 0; }
  .item .main, .habit .main { flex: 1; min-width: 0; }
  .title { outline: none; word-break: break-word; border-radius: 4px; }
  .title[contenteditable]:focus { background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .item.done .title { text-decoration: line-through; color: var(--muted); }
  .note { font-size: 0.76rem; color: var(--alta); }
  .small { font-size: 0.76rem; color: var(--faint); }
  .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .1s; }
  .item:hover .actions, .item:focus-within .actions, .habit:hover .actions, .habit:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .sortable .item { cursor: grab; }

  .chip {
    font-size: 0.72rem; border-radius: 99px; padding: 1px 8px; border: 1px solid var(--line);
    color: var(--faint); background: none; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--muted); border-color: var(--muted); }
  .chip.alta { color: var(--alta); border-color: var(--alta); }
  .chip.media { color: var(--media); border-color: var(--media); }
  .chip.baixa { color: var(--baixa); border-color: var(--baixa); }
  .pull { font-size: 0.78rem; border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
  .pull:hover { background: var(--accent-soft); }

  .habit { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px; }
  .habit:hover { background: var(--hover); }
  .habit.done .title { color: var(--muted); }
  .streak { font-size: 0.8rem; color: var(--fire); white-space: nowrap; min-width: 3.4em; text-align: right; }
  .streak.zero { color: var(--faint); }
  .week { display: flex; gap: 3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .dot.ok { background: var(--accent); }
  .dot.miss { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
  .dot.off { background: transparent; }
  @media (max-width: 420px) { .week { display: none; } }

  .collapse-btn { border: none; background: none; color: var(--muted); font-size: 0.84rem; padding: 6px 8px; border-radius: 6px; margin: 2px 0 4px; }
  .collapse-btn:hover { background: var(--hover); color: var(--text); }
  .empty { color: var(--muted); font-size: 0.88rem; padding: 6px 8px 10px; }
  .kbd-hint {
    font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 0 6px; font-family: ui-monospace, monospace;
  }
  @media (hover: none) { .kbd-hint { display: none; } }
  .ghost { opacity: 0.35; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal { background: var(--card); border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; }
  .modal h3 { margin: 0 0 14px; font-size: 1.05rem; }
  .modal label.field { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  .modal input[type=text] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; outline: none; margin-bottom: 14px;
  }
  .modal input[type=text]:focus { border-color: var(--accent); }
  .daypick { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .daypick button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: none; font-size: 0.8rem; }
  .daypick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .daypick button.on { color: #10201b; } }
  .quick { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .quick button { font-size: 0.78rem; border: none; background: var(--hover); border-radius: 99px; padding: 3px 10px; }
  .modal .row { display: flex; gap: 8px; align-items: center; }
  .modal .row .right { display: flex; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date-line" id="date-line"></div>
    <h1 id="greeting">Meu dia</h1>
    <div class="progress">
      <div class="bar"><span id="bar"></span></div>
      <span class="progress-text" id="progress-text"></span>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="card" id="habitos"></section>
      <section class="card" id="hoje"></section>
    </div>
    <div class="col">
      <section class="card" id="ideias"></section>
    </div>
  </div>
</div>

</body>
</html>
